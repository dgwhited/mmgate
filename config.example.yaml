server:
  listen_addr: ":8080"
  # Bounds header reads specifically — the slowloris defence.
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  # How long an idle keep-alive connection may linger.
  idle_timeout: 120s
  max_header_bytes: 1048576   # 1MB
  max_body_bytes: 10485760    # 10MB

upstream:
  url: "http://localhost:8065"
  timeout: 30s
  health_path: "/api/v4/system/ping"

security:
  # Seconds of allowed clock drift between client and mmgate. This is also the
  # replay window: a captured request can be replayed until it expires, so keep
  # it as small as your callers' clock accuracy allows.
  timestamp_tolerance: 30

clients:
  - id: "n8n-production"
    secret: "${N8N_BRIDGE_SECRET}"
    allowed_paths:
      - "/hooks/*"
    rate_limit: 60

  - id: "lambda-slashcmd"
    secret: "${LAMBDA_BRIDGE_SECRET}"
    allowed_paths:
      - "/api/v4/posts"
      - "/api/v4/commands/*"
      - "/hooks/*"
    rate_limit: 120

logging:
  level: "info"   # debug, info, warn, error
  format: "json"  # json or text
