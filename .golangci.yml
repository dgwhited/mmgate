version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - revive

  settings:
    gosec:
      excludes:
        # G304: the config path comes from a trusted CLI flag, not from request
        # input. Also annotated inline with #nosec at the call site.
        - G304

    revive:
      # Explicit rule list rather than revive's defaults: the default set
      # includes `exported` and `package-comments`, which would demand a
      # doc-comment pass over every existing symbol. These are the rules that
      # catch behaviour and correctness problems instead of house style.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

  exclusions:
    rules:
      # Test helpers legitimately ignore errors and hardcode credentials.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
